framework:
    asset_mapper:
        # The paths to make available to the asset mapper.
        paths:
            assets/: ''
            # Page-specific assets live next to their Twig templates.
            templates/css/: 'css'
            templates/js/: 'js'
        missing_import_mode: strict

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn
